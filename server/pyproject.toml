[project]
name = "video3d"
version = "0.1.0"
description = "Video to metric 3D scene server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "gradio_client>=1.4",
  "trimesh>=4.4",
  "numpy>=1.26",
  "scipy>=1.13",
  "pillow>=10",
  "httpx>=0.27",
]

[project.optional-dependencies]
# `uv sync --extra local` adds torch + MapAnything for the on-device backend (backends/local.py)
local = ["torch>=2.5", "torchvision", "mapanything"]
# `uv sync --extra splat` adds COLMAP (pycolmap, CPU SfM) for the photoreal splat track (splat.py)
splat = ["pycolmap>=3.12"]

[tool.uv.sources]
mapanything = { git = "https://github.com/facebookresearch/map-anything.git", rev = "3d10cf7" }

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
video3d-ingest = "video3d.cli:main"
video3d-splat = "video3d.splat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["video3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
